    <path d="M-70 -40 C-62 -24 -56 -8 -52 4" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <path d="M-60 -2 L-50 6 L-48 -6" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <circle cx="-42" cy="22" r="26" fill="url(#g-blue)" stroke="#4d3d2a" stroke-width="2.2"/>
    <path d="M-52 16 Q-48 12 -44 16" fill="none" stroke="#2a2438" stroke-width="2.2" stroke-linecap="round"/>
