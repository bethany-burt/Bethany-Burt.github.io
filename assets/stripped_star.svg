    <circle cx="-58" cy="0" r="42" fill="url(#g-gold)" stroke="#4d3d2a" stroke-width="2.2"/>
    <circle cx="-70" cy="-8" r="6.5" fill="#2a2438"/>
    <circle cx="-46" cy="-8" r="6.5" fill="#2a2438"/>
    <circle cx="-68.6" cy="-9.4" r="2" fill="#fff8ea"/>
    <circle cx="-44.6" cy="-9.4" r="2" fill="#fff8ea"/>
    <path d="M-69 11 Q-58 19 -47 11" fill="none" stroke="#2a2438" stroke-width="2.4" stroke-linecap="round"/>

    <circle cx="58" cy="0" r="30" fill="url(#g-gold-sm)" stroke="#4d3d2a" stroke-width="2.2"/>
    <circle cx="49.5" cy="-5" r="5" fill="#2a2438"/>
    <circle cx="66.5" cy="-5" r="5" fill="#2a2438"/>
    <circle cx="50.6" cy="-6.1" r="1.6" fill="#fff8ea"/>
