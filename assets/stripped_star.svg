    <circle cx="70" cy="14" r="5.8" fill="#2a2438"/>
    <circle cx="94" cy="14" r="5.8" fill="#2a2438"/>
    <circle cx="71.3" cy="12.7" r="1.8" fill="#fff8ea"/>
